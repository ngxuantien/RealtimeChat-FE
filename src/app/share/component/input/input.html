<div>
    @if(label()){
    <label [for]="inputId" class="mb-1 block text-sm font-semibold text-neutral-900 dark:text-white">
        {{label()}}
        @if(required()){
        <span class="text-red-main">*</span>
        }
    </label>
    }

    <div class="relative">
        <input [id]="inputId" [type]="inputType" [placeholder]="placeholder()" [(ngModel)]="value"
            [disabled]="disabled()" class="h-10 w-full rounded-lg border border-border-300 bg-white px-4 text-sm text-text-main outline-none transition
                   focus:border-primary-300 focus:ring-2 focus:ring-primary-100
                   disabled:cursor-not-allowed disabled:bg-border-400 disabled:opacity-60
                   dark:border-neutral-700 dark:bg-neutral-900 dark:text-white dark:focus:border-primary-main dark:disabled:bg-neutral-800"
            [class.pr-11]="type() === 'password'">
        @if(type() === 'password'){
        <button type="button" class="absolute cursor-pointer top-1/2 right-3 -translate-y-1/2 text-text-readonly hover:text-text-secondary dark:text-neutral-500 dark:hover:text-neutral-300"
            [attr.aria-label]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'" (click)="togglePassword()">
            @if (showPassword()) {
            <svg lucideEyeOff class="size-5"></svg>
            } @else {
            <svg lucideEye class="size-5"></svg>
            }
        </button>
        }
    </div>

    @if(error()){
    <p class="mt-1.5 text-xs text-red-main">{{error()}}</p>
    }
</div>
