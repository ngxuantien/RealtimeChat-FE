<div class="fixed inset-0 z-9999 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/30"></div>
  <div class="relative bg-white rounded-xl shadow-2xl w-100 mx-4 px-6 py-5 flex flex-col items-center text-center">
    <h3 class="text-[16px] font-semibold text-primary mb-3">{{ title() }}</h3>
    <p class="text-[14px] text-[#70707B] leading-5 mb-6 whitespace-pre-line" [innerHTML]="safeMessage"></p>
    <div class="flex items-center gap-3">
      <button
        class="w-28 py-2 rounded-md text-[#3F3F46] bg-dark-surface text-[14px] font-medium hover:bg-gray-200 transition"
        (click)="onCancel()">
        {{ closeLabel() }}
      </button>
      <button
        class="w-28 py-2 rounded-md text-white bg-primary text-[14px] font-medium hover:bg-blue-700 transition"
        (click)="onConfirm()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
