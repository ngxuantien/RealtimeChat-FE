<div class="flex flex-col gap-1" [class]="wrapperClasses()">
    @if (showHeader()) {
    <span class="px-1 text-xs text-dark-muted">
        @if (senderName()) {
        <span class="font-medium text-dark-text">{{ senderName() }}</span> ·
        }
        {{ time() }}
    </span>
    }
    <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm wrap-break-words sm:max-w-md" [class]="bubbleClasses()">
        {{ content() }}
    </div>
</div>
