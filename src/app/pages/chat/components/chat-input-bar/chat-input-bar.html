<!-- chat-input-bar.html -->
<div class="border-t border-dark-border px-6 py-4">
    <div class="flex items-center gap-3 rounded-xl border border-dark-border bg-dark-surface px-4 py-2.5">
        <svg lucidePaperclip class="h-4.5 w-4.5 cursor-pointer text-dark-muted hover:text-white"></svg>
        <svg lucideImage class="h-4.5 w-4.5 cursor-pointer text-dark-muted hover:text-white"></svg>
        <input
            type="text"
            [ngModel]="message()"
            (ngModelChange)="message.set($event)"
            (keydown.enter)="onSend()"
            placeholder="Nhập tin nhắn... (Enter để gửi, Shift+Enter xuống dòng)"
            class="flex-1 bg-transparent text-sm text-dark-text placeholder:text-dark-muted outline-none"
        />
        <svg lucideSmile class="h-4.5 w-4.5 cursor-pointer text-dark-muted hover:text-white"></svg>
        <button
            type="button"
            (click)="onSend()"
            class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary text-white hover:bg-primary-hover"
        >
            <svg lucideSend class="h-4 w-4"></svg>
        </button>
    </div>
</div>
