<section class="flex min-h-0 flex-1 flex-col bg-dark-bg">
    <app-chat-header
        [name]="contactName()"
        [avatarUrl]="contactAvatar()"
        [isOnline]="isOnline()"
        [isGroup]="isGroup()"
        [memberCount]="memberCount()"
        (toggleInfo)="toggleInfo.emit()"
    />

    <app-message-list [messages]="messages()" />

    <app-chat-input-bar (send)="sendMessage.emit($event)" (sendAttachment)="sendAttachment.emit($event)" />
</section>
