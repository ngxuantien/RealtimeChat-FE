<!-- chat-window.html -->
<section class="flex h-full flex-col bg-dark-bg">
    <app-chat-header
        [name]="contactName()"
        [avatarUrl]="contactAvatar()"
        [isOnline]="isOnline()"
        (toggleInfo)="toggleInfo.emit()"
    />

    <app-message-list [messages]="messages()" />

    <app-chat-input-bar (send)="sendMessage.emit($event)" />
</section>
