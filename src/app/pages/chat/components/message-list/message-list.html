<!-- message-list.html -->
@if (messages().length === 0) {
    <div class="flex flex-1 flex-col items-center justify-center gap-3">
        <div class="flex h-14 w-14 items-center justify-center rounded-full bg-dark-surface">
            <svg lucideMessageCircle class="h-6 w-6 text-dark-muted"></svg>
        </div>
        <p class="font-medium text-dark-text">Chưa có tin nhắn nào</p>
        <p class="text-sm text-dark-muted">Hãy bắt đầu cuộc trò chuyện!</p>
    </div>
} @else {
    <div class="flex flex-1 flex-col gap-4 overflow-y-auto px-6 py-4">
        @for (msg of messages(); track msg.id) {
            <app-message-bubble [content]="msg.content" [time]="msg.time" [isMine]="msg.isMine" />
        }
    </div>
}
