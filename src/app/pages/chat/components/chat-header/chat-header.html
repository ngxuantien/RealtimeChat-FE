<div class="flex items-center justify-between gap-2 border-b border-dark-border px-4 py-3 md:px-6">
    <div class="flex min-w-0 items-center gap-3">
        <a routerLink="/" class="shrink-0 text-dark-muted hover:text-dark-text md:hidden">
            <lucide-icon name="arrow-left" class="h-5 w-5"></lucide-icon>
        </a>
        <div class="flex h-10 w-10 shrink-0 items-center justify-center overflow-hidden rounded-full bg-neutral-700">
            @if (avatarUrl(); as avatar) {
            <img [src]="avatar" class="h-full w-full object-cover" alt="" />
            } @else {
            <lucide-icon name="user" class="h-5 w-5 text-dark-muted"></lucide-icon>
            }
        </div>
        <div class="min-w-0">
            <p class="truncate text-sm font-semibold text-dark-text">{{ name() }}</p>
            @if (isOnline()) {
            <p class="text-xs text-success">Đang hoạt động</p>
            } @else {
            <p class="text-xs text-dark-muted">Ngoại tuyến</p>
            }
        </div>
    </div>
    <div class="flex shrink-0 items-center gap-3 text-dark-muted sm:gap-4">
        <lucide-icon name="search" class="hidden h-4.5 w-4.5 cursor-pointer hover:text-dark-text sm:block"></lucide-icon>
        <lucide-icon name="phone" class="h-4.5 w-4.5 cursor-pointer hover:text-dark-text"></lucide-icon>
        <lucide-icon name="video" class="hidden h-4.5 w-4.5 cursor-pointer hover:text-dark-text sm:block"></lucide-icon>
        <lucide-icon name="info" class="hidden h-4.5 w-4.5 cursor-pointer hover:text-dark-text sm:block" (click)="toggleInfo.emit()"></lucide-icon>
    </div>
</div>
