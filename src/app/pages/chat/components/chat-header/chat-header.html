<div class="flex items-center justify-between gap-2 border-b border-border-300 px-4 py-3 md:px-6">
    <div class="flex min-w-0 items-center gap-3">
        <a routerLink="/" class="shrink-0 text-text-secondary hover:text-text-heading md:hidden">
            <lucide-icon name="arrow-left" class="h-5 w-5"></lucide-icon>
        </a>
        <div class="relative h-10 w-10 shrink-0">
            <div class="flex h-full w-full items-center justify-center overflow-hidden rounded-full bg-neutral-700">
                @if (avatarUrl(); as avatar) {
                <img [src]="avatar" class="h-full w-full object-cover" alt="" />
                } @else {
                <lucide-icon [name]="isGroup() ? 'users' : 'user'" class="h-5 w-5 text-text-secondary"></lucide-icon>
                }
            </div>
            @if (isGroup()) {
            <span
                class="absolute -bottom-0.5 -right-0.5 flex h-4.5 w-4.5 items-center justify-center rounded-full border-2 border-bg-card bg-primary-main">
                <lucide-icon name="users" class="h-2.5 w-2.5 text-white"></lucide-icon>
            </span>
            }
        </div>
        <div class="min-w-0">
            <p class="truncate text-sm font-semibold text-text-heading">{{ name() }}</p>
            @if (isGroup()) {
            <p class="text-xs text-text-secondary">{{ memberCount() }} thành viên</p>
            } @else if (isOnline()) {
            <p class="text-xs text-green-main">Đang hoạt động</p>
            } @else {
            <p class="text-xs text-text-secondary">Ngoại tuyến</p>
            }
        </div>
    </div>
    <div class="relative flex shrink-0 items-center gap-3 text-text-secondary sm:gap-4">
        <lucide-icon name="search" (click)="toggleSearch.emit()"
            class="hidden h-4.5 w-4.5 cursor-pointer hover:text-text-heading sm:block"></lucide-icon>
        <lucide-icon name="phone" class="h-4.5 w-4.5 cursor-pointer hover:text-text-heading"></lucide-icon>
        <lucide-icon name="info" (click)="toggleInfo.emit()"
            class="hidden h-4.5 w-4.5 cursor-pointer hover:text-text-heading sm:block"></lucide-icon>
        <lucide-icon name="ellipsis" (click)="toggleMoreMenu()"
            class="h-4.5 w-4.5 cursor-pointer hover:text-text-heading"></lucide-icon>

        @if(showMoreMenu()){
        <div
            class="absolute right-0 top-full z-20 mt-2 w-48 rounded-lg border border-border-300 bg-bg-card py-1 shadow-lg">
            <button type="button" (click)="onToggleSearch()"
                class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-text-heading hover:bg-bg-hover sm:hidden">
                <lucide-icon name="search" class="h-4 w-4"></lucide-icon>
                Tìm kiếm tin nhắn
            </button>
            <button type="button" (click)="onToggleInfo()"
                class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-text-heading hover:bg-bg-hover sm:hidden">
                <lucide-icon name="info" class="h-4 w-4"></lucide-icon>
                Xem chi tiết
            </button>
            <button type="button" (click)="onToggleMute()"
                class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-text-heading hover:bg-bg-hover">
                <lucide-icon [name]="isMuted() ? 'bell' : 'bell-off'" class="h-4 w-4"></lucide-icon>
                {{ isMuted() ? 'Bật thông báo' : 'Tắt thông báo' }}
            </button>
            <button type="button" (click)="onDeleteHistory()"
                class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-red-main hover:bg-bg-hover">
                <lucide-icon name="trash" class="h-4 w-4"></lucide-icon>
                Xóa lịch sử trò chuyện
            </button>
        </div>
        }
    </div>
</div>
