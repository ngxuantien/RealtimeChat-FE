<div class="flex min-h-screen items-center justify-center bg-neutral-50 px-4 dark:bg-neutral-950">
  <div class="w-full max-w-105 rounded-[20px] bg-white px-10 py-10 shadow-[0_18px_45px_rgba(15,23,42,0.12)] dark:bg-neutral-900 dark:shadow-none">
    <div class="mb-8 flex flex-col items-center text-center">
      <h1 class="text-2xl font-bold leading-none text-neutral-900 dark:text-white">Đặt lại mật khẩu</h1>
      @if (!isSuccess()) {
      <p class="mt-3 text-sm text-neutral-500 dark:text-neutral-400">Nhập mật khẩu mới cho tài khoản của bạn</p>
      }
    </div>

    @if (isSuccess()) {
    <p class="text-center text-sm text-text-secondary">
      Đổi mật khẩu thành công! Đang chuyển về trang đăng nhập...
    </p>
    } @else {
    <form (ngSubmit)="submit()">
      <div class="mb-4">
        <app-ui-input label="Mật khẩu mới" placeholder="Nhập mật khẩu mới" type="password" [required]="true"
          [(value)]="newPassword" />
      </div>
      <div class="mb-4">
        <app-ui-input label="Nhập lại mật khẩu" placeholder="Nhập lại mật khẩu mới" type="password" [required]="true"
          [(value)]="confirmPassword" />
      </div>

      <app-ui-button type="submit" variant="primary" [full]="true" [loading]="isLoading()">Đặt lại mật khẩu</app-ui-button>
    </form>

    <p class="pt-4 text-center text-sm text-text-secondary dark:text-neutral-400">
      <a routerLink="/auth/login" class="font-medium text-primary-main">Quay lại đăng nhập</a>
    </p>
    }
  </div>
</div>
