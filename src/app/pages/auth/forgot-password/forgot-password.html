<div class="flex min-h-screen items-center justify-center bg-neutral-50 px-4 dark:bg-neutral-950">
  <div class="w-full max-w-105 rounded-[20px] bg-white px-10 py-10 shadow-[0_18px_45px_rgba(15,23,42,0.12)] dark:bg-neutral-900 dark:shadow-none">
    <div class="mb-8 flex flex-col items-center text-center">
      <h1 class="text-2xl font-bold leading-none text-neutral-900 dark:text-white">Quên mật khẩu?</h1>
      <p class="mt-3 text-sm text-neutral-500 dark:text-neutral-400">Nhập email đã đăng ký, chúng tôi sẽ gửi link đặt lại mật khẩu</p>
    </div>

    @if (isSent()) {
    <p class="mb-4 text-center text-sm text-text-secondary">
      Nếu email tồn tại, một link đặt lại mật khẩu đã được gửi đi. Kiểm tra hộp thư của bạn nhé.
    </p>
    } @else {
    <form (ngSubmit)="submit()">
      <div class="mb-4">
        <app-ui-input label="Email" placeholder="Nhập email đã đăng ký" type="email"
          [required]="true" [(value)]="email" />
      </div>

      @if (errorMessage()) {
      <p class="mb-4 text-sm text-red-500">{{ errorMessage() }}</p>
      }

      <app-ui-button type="submit" variant="primary" [full]="true" [loading]="isLoading()">Gửi link đặt lại</app-ui-button>
    </form>
    }

    <p class="pt-4 text-center text-sm text-text-secondary dark:text-neutral-400">
      <a routerLink="/auth/login" class="font-medium text-primary-main">Quay lại đăng nhập</a>
    </p>
  </div>
</div>
