<div class="flex min-h-screen items-center justify-center bg-[#F4F6F8] px-4">
  <div class="w-full max-w-[420px] rounded-[20px] bg-white px-10 py-11 shadow-[0_18px_45px_rgba(15,23,42,0.12)]">
    <div class="mb-8 flex flex-col items-center">
      <div class="mb-4 flex h-[60px] w-[60px] items-center justify-center rounded-[18px] bg-[#2EA8E5]">
        <svg lucideMessageSquare class="h-8 w-8 text-white"></svg>
      </div>

      <h1 class="text-[26px] font-bold leading-none text-[#090B1A]">ChatApp</h1>
      <p class="mt-3 text-sm text-[#8A849B]">Kết nối và trò chuyện mọi lúc mọi nơi</p>
    </div>

    <form class="space-y-5" (ngSubmit)="login()">
      <div>
        <label class="mb-2 block text-sm font-semibold text-[#090B1A]">
          Email hoặc số điện thoại
        </label>
        <input
          type="text"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          class="h-[44px] w-full rounded-[10px] border border-[#E1E5EA] px-4 text-sm outline-none transition focus:border-[#2EA8E5] focus:ring-2 focus:ring-[#2EA8E5]/15"
        />
      </div>

      <div>
        <label class="mb-2 block text-sm font-semibold text-[#090B1A]">
          Mật khẩu
        </label>

        <div class="relative">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            class="h-[44px] w-full rounded-[10px] border border-[#E1E5EA] px-4 pr-11 text-sm outline-none transition focus:border-[#2EA8E5] focus:ring-2 focus:ring-[#2EA8E5]/15"
          />

          <button
            type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-[#8A8FA3]"
            (click)="togglePassword()"
          >
            <svg lucideEye class="h-5 w-5"></svg>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-[#090B1A]">
          <input
            type="checkbox"
            [ngModel]="rememberMe()"
            (ngModelChange)="rememberMe.set($event)"
            name="rememberMe"
            class="h-4 w-4 rounded border-[#C8CDD6]"
          />
          Ghi nhớ đăng nhập
        </label>

        <a class="font-medium text-[#1EA7F1]" href="#">Quên mật khẩu?</a>
      </div>

      <button
        type="submit"
        class="h-[48px] w-full rounded-[10px] bg-[#2EA8E5] text-sm font-bold text-white transition hover:bg-[#2499D5]"
      >
        Đăng nhập
      </button>

      <p class="pt-1 text-center text-sm text-[#8A849B]">
        Chưa có tài khoản?
        <a class="font-bold text-[#1EA7F1]" href="#">Đăng ký ngay</a>
      </p>
    </form>
  </div>
</div>
