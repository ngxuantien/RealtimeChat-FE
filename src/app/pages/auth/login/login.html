<div class="flex min-h-screen items-center justify-center bg-neutral-50 px-4 dark:bg-neutral-950">
  <div class="w-full max-w-105 rounded-[20px] bg-white px-10 py-10 shadow-[0_18px_45px_rgba(15,23,42,0.12)] dark:bg-neutral-900 dark:shadow-none">

    <div class="mb-8 flex flex-col items-center">
      <div class="mb-4 flex h-15 w-15 items-center justify-center rounded-[18px] bg-primary">
        <svg lucideMessageSquare class="h-8 w-8 text-white"></svg>
      </div>
      <h1 class="text-2xl font-bold leading-none text-neutral-900 dark:text-white">ChatApp</h1>
      <p class="mt-3 text-sm text-neutral-500 dark:text-neutral-400">Kết nối và trò chuyện mọi lúc mọi nơi</p>
    </div>

    <form (ngSubmit)="login()">
      <div class="mb-4">
        <app-ui-input
          label="Email"
          placeholder="Mời nhập email"
          type="email"
          [required]="true"
          [(value)]="email"
        />
      </div>

      <div class="mb-4">
        <app-ui-input
          label="Mật khẩu"
          placeholder="Mời nhập mật khẩu"
          type="password"
          [required]="true"
          [(value)]="password"
        />
      </div>

      <div class="mb-6 flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-[#566474] dark:text-neutral-400">
          <input type="checkbox" [ngModel]="rememberMe()" (ngModelChange)="rememberMe.set($event)" name="rememberMe"
            class="h-4 w-4 rounded border-[#E1E2E4] accent-primary" />
          Ghi nhớ đăng nhập
        </label>
        <a class="font-medium text-primary" href="#">Quên mật khẩu?</a>
      </div>

      @if (errorMessage()) {
        <p class="mb-4 text-sm text-red-500">{{ errorMessage() }}</p>
      }

      <app-ui-button type="submit" variant="primary" [full]="true" [loading]="isLoading()">Đăng nhập</app-ui-button>

      <p class="pt-4 text-center text-sm text-[#566474] dark:text-neutral-400">
        Chưa có tài khoản?
        <a routerLink="/auth/register" class="font-medium text-primary">Đăng ký ngay</a>
      </p>
    </form>

  </div>
</div>
