<div class="mx-auto flex max-w-3xl flex-col gap-6">
    <div>
        <h1 class="text-2xl font-bold text-text-heading">Hồ sơ của bạn</h1>
        <p class="mt-1 text-sm text-text-secondary">Thông tin này sẽ hiển thị với những người bạn nhắn tin</p>
    </div>

    <app-settings-card title="Ảnh đại diện">
        <input #avatarInput type="file" accept="image/*" class="hidden" (change)="onAvatarSelected($event)" />
        <div class="flex flex-col items-center gap-4 text-center sm:flex-row sm:items-center sm:text-left">
            <div class="relative h-16 w-16 shrink-0">
                @if (avatarUrl(); as avatar) {
                <img [src]="avatar" class="h-full w-full rounded-full object-cover" alt="" />
                } @else {
                <div class="flex h-full w-full items-center justify-center rounded-full bg-neutral-700">
                    <lucide-icon name="user" class="h-6 w-6 text-text-secondary"></lucide-icon>
                </div>
                }
                <button type="button" (click)="pickAvatar()" [disabled]="isUploadingAvatar()"
                    class="absolute -right-1 -bottom-1 flex h-6 w-6 items-center justify-center rounded-full bg-primary-main text-white ring-2 ring-bg-hover disabled:opacity-50">
                    @if (isUploadingAvatar()) {
                    <lucide-icon name="loader-circle" class="h-3.5 w-3.5 animate-spin"></lucide-icon>
                    } @else {
                    <lucide-icon name="camera" class="h-3.5 w-3.5"></lucide-icon>
                    }
                </button>
            </div>
            <div class="min-w-0 flex-1">
                <p class="text-sm font-medium text-text-heading">{{ displayName() }}</p>
                <p class="mt-0.5 text-xs text-text-secondary">JPG, PNG hoặc GIF. Tối đa 5MB.</p>
                <div class="mt-3 flex flex-wrap justify-center gap-2 sm:justify-start">
                    <button type="button" (click)="pickAvatar()" [disabled]="isUploadingAvatar()"
                        class="rounded-lg border border-primary-main px-3 py-1.5 text-sm font-medium text-primary-main transition hover:bg-primary-main/10 disabled:opacity-50">
                        Đổi ảnh
                    </button>
                </div>
            </div>
        </div>
    </app-settings-card>

    <app-settings-card title="Thông tin cá nhân">
        <form class="flex flex-col gap-4" (ngSubmit)="saveProfile()">
            <div>
                <label for="display-name" class="mb-1.5 block text-sm font-medium text-text-heading">Tên hiển
                    thị</label>
                <input id="display-name" type="text" name="displayName" [ngModel]="displayName()"
                    (ngModelChange)="displayName.set($event)"
                    class="h-11 w-full rounded-lg border border-border-300 bg-bg-card px-4 text-sm text-text-heading outline-none transition focus:border-primary-main focus:ring-2 focus:ring-primary-main/30" />
            </div>

            <div>
                <label for="email" class="mb-1.5 block text-sm font-medium text-text-heading">Email</label>
                <p class="mb-1.5 text-xs text-text-secondary">Email dùng để đăng nhập và nhận thông báo quan trọng</p>
                <input id="email" type="email" name="email" [ngModel]="email()" (ngModelChange)="email.set($event)"
                    class="h-11 w-full rounded-lg border border-border-300 bg-bg-card px-4 text-sm text-text-heading outline-none transition focus:border-primary-main focus:ring-2 focus:ring-primary-main/30" />
            </div>

            <div>
                <label for="phone" class="mb-1.5 block text-sm font-medium text-text-heading">Số điện thoại</label>
                <input id="phone" type="tel" name="phone" [ngModel]="phone()" (ngModelChange)="phone.set($event)"
                    class="h-11 w-full rounded-lg border border-border-300 bg-bg-card px-4 text-sm text-text-heading outline-none transition focus:border-primary-main focus:ring-2 focus:ring-primary-main/30" />
            </div>

            <div class="flex justify-end">
                <button type="submit" [disabled]="isSaving()"
                    class="flex items-center gap-2 rounded-lg bg-primary-main px-5 py-2.5 text-sm font-medium text-white transition hover:bg-primary-700 disabled:opacity-50">
                    <lucide-icon name="save" class="h-4 w-4"></lucide-icon>
                    {{ isSaving() ? 'Đang lưu...' : 'Lưu thay đổi' }}
                </button>
            </div>
        </form>
    </app-settings-card>
</div>
