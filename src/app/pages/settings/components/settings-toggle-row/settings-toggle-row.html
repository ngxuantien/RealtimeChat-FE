<div class="flex items-start gap-3">
    @if (icon()) {
    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-indigo-500/15">
        <lucide-icon [name]="icon()!" class="h-4 w-4 text-indigo-400"></lucide-icon>
    </div>
    }
    <div>
        <p class="text-sm font-medium text-dark-text">{{ label() }}</p>
        <p class="mt-0.5 text-xs text-dark-muted">{{ description() }}</p>
    </div>
</div>
<app-toggle-switch [(checked)]="checked" />
