<button type="button" role="switch" [attr.aria-checked]="checked()" (click)="toggle()"
    class="relative h-6 w-11 shrink-0 rounded-full transition-colors"
    [class]="checked() ? 'bg-indigo-500' : 'bg-neutral-100'">
    <span class="absolute top-0.5 left-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform"
        [class.translate-x-5]="checked()"></span>
</button>
