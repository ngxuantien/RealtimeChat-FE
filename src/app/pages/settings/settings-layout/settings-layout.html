<div class="flex h-screen flex-col bg-bg-card text-text-heading">
    <header class="flex items-center gap-4 border-b border-border-300 px-4 py-3 md:px-6 md:py-4">
        <button type="button" routerLink="/"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-text-secondary transition hover:bg-neutral-100 hover:text-text-heading">
            <lucide-icon name="arrow-left" class="h-5 w-5"></lucide-icon>
        </button>
        <div class="flex min-w-0 items-center gap-2 text-sm">
            <div class="h-6 w-6 shrink-0 rounded-lg bg-indigo-500"></div>
            <span class="shrink-0 font-semibold text-text-heading">ChatFlow</span>
            <span class="shrink-0 text-text-secondary">/</span>
            <span class="truncate text-text-secondary">Cài đặt</span>
        </div>
    </header>

    <div class="flex min-h-0 flex-1 flex-col md:flex-row">
        <aside class="shrink-0 overflow-x-auto border-b border-border-300 px-2 py-2 md:w-72 md:overflow-y-auto md:overflow-x-visible md:border-r md:border-b-0 md:px-4 md:py-6">
            <p class="mb-3 hidden px-3 text-xs font-semibold tracking-wide text-text-secondary md:block">CÀI ĐẶT</p>
            <nav class="flex gap-1 md:flex-col">
                @for (item of navItems; track item.path) {
                <a [routerLink]="[item.path]" routerLinkActive="bg-indigo-500/10" #rla="routerLinkActive"
                    class="flex shrink-0 items-center gap-3 rounded-lg px-3 py-2.5 transition hover:bg-neutral-100">
                    <lucide-icon [name]="item.icon" class="h-5 w-5 shrink-0"
                        [class]="rla.isActive ? 'text-indigo-400' : (item.danger ? 'text-red-400' : 'text-text-secondary')"></lucide-icon>
                    <div class="min-w-0">
                        <p class="text-sm font-medium whitespace-nowrap"
                            [class]="rla.isActive ? 'text-indigo-400' : (item.danger ? 'text-red-400' : 'text-text-heading')">
                            {{ item.label }}
                        </p>
                        <p class="hidden truncate text-xs text-text-secondary md:block">{{ item.description }}</p>
                    </div>
                </a>
                }
            </nav>
        </aside>

        <main class="flex-1 overflow-y-auto px-4 py-6 md:px-8 md:py-8">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
