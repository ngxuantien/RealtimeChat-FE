<div class="flex h-screen flex-col bg-bg-card text-text-heading">
    <header class="flex items-center gap-4 border-b border-border-300 px-4 py-3 md:px-6 md:py-4">
        <button type="button" [routerLink]="isDetailOpen() ? ['/settings/menu'] : ['/']"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-text-secondary transition hover:bg-neutral-100 hover:text-text-heading md:hidden!">
            <lucide-icon name="arrow-left" class="h-5 w-5"></lucide-icon>
        </button>
        <button type="button" routerLink="/"
            class="hidden h-9 w-9 shrink-0 items-center justify-center rounded-lg text-text-secondary transition hover:bg-neutral-100 hover:text-text-heading md:flex">
            <lucide-icon name="arrow-left" class="h-5 w-5"></lucide-icon>
        </button>
        <div class="flex min-w-0 items-center gap-2 text-sm">
            <div class="h-6 w-6 shrink-0 rounded-lg bg-primary-main"></div>
            <span class="shrink-0 font-semibold text-text-heading">ChatFlow</span>
            <span class="shrink-0 text-text-secondary">/</span>
            <span class="truncate text-text-secondary">Cài đặt</span>
        </div>
    </header>

    <div class="flex min-h-0 flex-1 flex-col md:flex-row">
        <aside [class]="asideClass()">
            <p class="mb-3 px-3 text-xs font-semibold tracking-wide text-text-secondary">CÀI ĐẶT</p>
            <nav class="flex flex-col gap-1">
                @for (item of navItems; track item.path) {
                <a [routerLink]="[item.path]" routerLinkActive="bg-primary-main/10" #rla="routerLinkActive"
                    class="flex items-center gap-3 rounded-lg px-3 py-2.5 transition hover:bg-neutral-100">
                    <lucide-icon [name]="item.icon" class="h-5 w-5 shrink-0"
                        [class]="rla.isActive ? 'text-primary-main' : 'text-text-secondary'"></lucide-icon>
                    <div class="min-w-0">
                        <p class="text-sm font-medium whitespace-nowrap"
                            [class]="rla.isActive ? 'text-primary-main' : 'text-text-heading'">
                            {{ item.label }}
                        </p>
                        <p class="truncate text-xs text-text-secondary">{{ item.description }}</p>
                    </div>
                </a>
                }
            </nav>
        </aside>

        <main [class]="mainClass()">
            @if (!isDetailOpen()) {
            <div class="hidden h-full items-center justify-center text-sm text-text-secondary md:flex">
                Chọn một mục cài đặt để xem chi tiết
            </div>
            }
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
