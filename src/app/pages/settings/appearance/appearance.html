<div class="mx-auto flex max-w-3xl flex-col gap-6">
    <div>
        <h1 class="text-2xl font-bold text-text-heading">Giao diện</h1>
        <p class="mt-1 text-sm text-text-secondary">Tùy chỉnh chủ đề hiển thị của ứng dụng</p>
    </div>

    <app-settings-card title="Chủ đề" description="Chọn giao diện sáng hoặc tối. Lựa chọn được lưu lại cho lần truy cập sau">
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <button type="button" (click)="select('light')" class="rounded-xl border-2 p-4 text-left transition"
                [class]="themeService.theme() === 'light' ? 'border-indigo-500' : 'border-border-300 hover:border-text-secondary'">
                <div class="mb-3 overflow-hidden rounded-lg border border-neutral-200">
                    <div class="flex items-center gap-1 bg-neutral-100 px-2 py-1.5">
                        <span class="h-1.5 w-1.5 rounded-full bg-red-400"></span>
                        <span class="h-1.5 w-1.5 rounded-full bg-yellow-400"></span>
                        <span class="h-1.5 w-1.5 rounded-full bg-green-400"></span>
                    </div>
                    <div class="flex gap-1.5 bg-white p-2">
                        <div class="h-10 w-6 rounded bg-neutral-100"></div>
                        <div class="flex-1 space-y-1">
                            <div class="h-1.5 w-3/4 rounded bg-neutral-200"></div>
                            <div class="h-1.5 w-1/2 rounded bg-neutral-200"></div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <lucide-icon name="sun" class="h-4 w-4 text-text-heading"></lucide-icon>
                        <span class="text-sm font-medium text-text-heading">Sáng</span>
                    </div>
                    @if (themeService.theme() === 'light') {
                    <lucide-icon name="circle-check-big" class="h-4 w-4 text-indigo-400"></lucide-icon>
                    }
                </div>
            </button>

            <button type="button" (click)="select('dark')" class="rounded-xl border-2 p-4 text-left transition"
                [class]="themeService.theme() === 'dark' ? 'border-indigo-500' : 'border-border-300 hover:border-text-secondary'">
                <div class="mb-3 overflow-hidden rounded-lg border border-neutral-800">
                    <div class="flex items-center gap-1 bg-neutral-800 px-2 py-1.5">
                        <span class="h-1.5 w-1.5 rounded-full bg-red-400"></span>
                        <span class="h-1.5 w-1.5 rounded-full bg-yellow-400"></span>
                        <span class="h-1.5 w-1.5 rounded-full bg-green-400"></span>
                    </div>
                    <div class="flex gap-1.5 bg-neutral-950 p-2">
                        <div class="h-10 w-6 rounded bg-neutral-800"></div>
                        <div class="flex-1 space-y-1">
                            <div class="h-1.5 w-3/4 rounded bg-neutral-700"></div>
                            <div class="h-1.5 w-1/2 rounded bg-neutral-700"></div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <lucide-icon name="moon" class="h-4 w-4 text-text-heading"></lucide-icon>
                        <span class="text-sm font-medium text-text-heading">Tối</span>
                    </div>
                    @if (themeService.theme() === 'dark') {
                    <lucide-icon name="circle-check-big" class="h-4 w-4 text-indigo-400"></lucide-icon>
                    }
                </div>
            </button>
        </div>
    </app-settings-card>
</div>
